add_newline = true

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$cmake\
$nix_shell\
$fill\
$cmd_duration\
$time\
$line_break\
$character
"""

[directory]
truncation_length = 4
truncate_to_repo = false
style = "bold blue"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_commit]
commit_hash_length = 4
tag_symbol = "🔖 "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold red)'

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "

[cmake]
disabled = false
format = 'via [$name $version]($style) '

[nix_shell]
symbol = " "
format = "[$symbol$state]($style) "
style = "bold blue"

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
format = "[󱎫 $duration]($style) "
style = "yellow"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "dimmed white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
